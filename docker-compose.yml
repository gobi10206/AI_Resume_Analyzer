version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: resume_analyzer_db
    restart: always
    environment:
      POSTGRES_USER: resume_user
      POSTGRES_PASSWORD: resume_password
      POSTGRES_DB: resume_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_user -d resume_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_analyzer_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://resume_user:resume_password@postgres:5432/resume_db
      SECRET_KEY: dev-super-secret-key-ai-resume-2026
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      UPLOAD_DIR: /app/uploads
      USE_OLLAMA: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume_analyzer_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
